name: Update lotto results
on:
  schedule:
    # 9:20, 10:20, 11:20 PM and 7:20 AM Philippine time.
    - cron: '20 13,14,15,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_results.py', 'scripts/weekly_plan.py', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: lotto-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test importer
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare immutable weekly plan
        id: plan
        continue-on-error: true
        run: python scripts/weekly_plan.py
      - name: Fetch official results
        id: results
        continue-on-error: true
        run: python scripts/update_results.py
      - name: Commit updated results
        run: |
          if [ -n "$(git status --porcelain -- results.json weekly-plan.json plans/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add results.json weekly-plan.json plans/
            git commit -m 'Update PCSO results and weekly plan'
            git push
          fi
      - name: Sync draws to Supabase
        id: sync
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase.py
      - name: Report any failed step after saving what succeeded
        if: contains(join(steps.*.outcome, ','), 'failure')
        run: |
          echo "tests=${{ steps.tests.outcome }} plan=${{ steps.plan.outcome }} results=${{ steps.results.outcome }} sync=${{ steps.sync.outcome }}"
          exit 1
