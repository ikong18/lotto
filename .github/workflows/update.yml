name: Update lotto results
on:
  schedule:
    # 9:20, 10:20, 11:20 PM and 7:20 AM Philippine time.
    - cron: '20 13,14,15,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_results.py', 'scripts/weekly_plan.py', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: lotto-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test importer
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare immutable weekly plan
        run: python scripts/weekly_plan.py
      - name: Fetch official results
        id: results
        continue-on-error: true
        run: python scripts/update_results.py
      - name: Commit updated results
        run: |
          if [ -n "$(git status --porcelain -- results.json weekly-plan.json plans/)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add results.json weekly-plan.json plans/
            git commit -m 'Update PCSO results and weekly plan'
            git push
          fi
      - name: Report source failure after saving plan
        if: steps.results.outcome == 'failure'
        run: exit 1
