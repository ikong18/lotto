name: Regression checks
on:
  pull_request:
  push:
    branches: [main]
    paths: ['*.js', '*.cjs', '*.html', 'scripts/**', '.github/workflows/test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests.cjs
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: node feed-tests.cjs
      - name: Verify public fallback sources from the GitHub runner (read-only)
        if: github.event_name == 'pull_request'
        run: python scripts/update_results.py --force-fallback --dry-run
